name: First Home CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: first_home_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d first_home_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/first_home_ci
      GRAPH_TENANT_ID: ci-placeholder
      GRAPH_CLIENT_ID: ci-placeholder
      GRAPH_CLIENT_SECRET: ci-placeholder
      GRAPH_SENDER_EMAIL: ci-placeholder@example.com
      GRAPH_RECIPIENT_EMAIL: ci-placeholder@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          POSTGRES_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          FIRST_HOME_ALLOW_POSTGRES_TESTS: "true"
        run: python -m pytest tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e -- --workers=1

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test Docker API routing
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
