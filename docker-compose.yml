services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - first-home

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL}
      GRAPH_RECIPIENT_EMAIL: ${GRAPH_RECIPIENT_EMAIL}
    depends_on:
      - db
    expose:
      - "8000"
    networks:
      - first-home

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - first-home

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf &&
      exec nginx -g 'daemon off;'"
    networks:
      - first-home

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      ONEDRIVE_USER: admin@firsthomefintech.ae
      ONEDRIVE_FOLDER: FirstHome-Encrypted-Backups
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETRY_SECONDS: "900"
      PG_DUMP_TIMEOUT_SECONDS: "3600"
    secrets:
      - backup_encryption_passphrase
    depends_on:
      - db
    networks:
      - first-home

volumes:
  postgres_data:

networks:
  first-home:
    driver: bridge

secrets:
  backup_encryption_passphrase:
    file: ./secrets/backup_encryption_passphrase.txt
